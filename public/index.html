<!doctype html>
<html lang="fr">
<head>

  <meta name="description" content="Brigands — jeu de plis multijoueur en ligne pour trois joueurs.">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="online-theme.css">

<body>
